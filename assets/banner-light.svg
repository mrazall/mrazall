    <path d="M0 0 C -40 0 -50 -50 -90 -50"/><path d="M0 0 C 40 0 50 -50 90 -50"/><path d="M0 0 C 40 0 50 50 90 50"/><path d="M0 0 C -40 0 -50 50 -90 50"/>
    <circle cx="-90" cy="-50" r="9"/><circle cx="90" cy="-50" r="9"/><circle cx="90" cy="50" r="9"/><circle cx="-90" cy="50" r="9"/>
  </g>
  <circle cx="1000" cy="170" r="20" fill="#1d7a52"/>
  <circle cx="1000" cy="170" r="20" fill="none" stroke="#1d7a52" stroke-opacity=".5">
