<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="mrazall — делаю продукты и держу для них свой сервер">
  <rect width="1200" height="300" rx="18" fill="#ebe8e1"/>
  <g font-family="Onest, Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
