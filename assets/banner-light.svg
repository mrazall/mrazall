    <text x="56" y="160" font-size="62" font-weight="800" letter-spacing="-2" fill="#16150f">Делаю продукты и держу</text>
    <text x="56" y="228" font-size="62" font-weight="800" letter-spacing="-2" fill="#16150f">для них <tspan fill="#1d7a52">свой</tspan> сервер.</text>
